name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm --version

      - name: Require lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      - name: Seed local D1
        run: pnpm db:seed:local

      - name: Start local Worker
        run: |
          (cd services/api && pnpm exec wrangler dev --port 8787 > /tmp/boardops-worker.log 2>&1 & echo $! > /tmp/boardops-worker.pid)
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boardops-worker.log
          exit 1

      - name: Health and readiness probes
        run: |
          curl --fail --silent http://127.0.0.1:8787/health
          curl --fail --silent http://127.0.0.1:8787/ready

      - name: Sign in test users
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -c /tmp/resident.cookies -H 'Content-Type: application/json' \
            -d '{"email":"arjun@boardops.local","password":"boardops-demo"}' \
            http://127.0.0.1:8787/api/v1/auth/login > /tmp/resident-login.json
          curl --fail --silent --show-error -c /tmp/admin.cookies -H 'Content-Type: application/json' \
            -d '{"email":"admin@boardops.local","password":"boardops-demo"}' \
            http://127.0.0.1:8787/api/v1/auth/login > /tmp/admin-login.json

      - name: Calendar archive regression
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -b /tmp/resident.cookies \
            'http://127.0.0.1:8787/api/v1/meals/entries?date=2026-09-02' > /tmp/closed-meals.json
          grep -q '"status":"OFF"' /tmp/closed-meals.json
          grep -q '"locked":true' /tmp/closed-meals.json
          curl --fail --silent --show-error -b /tmp/admin.cookies -X DELETE -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:8787/api/v1/calendar/events/calendar-closure-001 > /tmp/archive.json
          grep -q '"archived":true' /tmp/archive.json
          curl --fail --silent --show-error -b /tmp/admin.cookies \
            'http://127.0.0.1:8787/api/v1/calendar/service-status?date=2026-09-02' > /tmp/service-status.json
          grep -q '"mealsDisabled":false' /tmp/service-status.json

      - name: Leave review regression
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d '{"status":"APPROVED","adminNotes":"CI seeded leave approval"}' \
            http://127.0.0.1:8787/api/v1/leave/leave-demo-ananya-001 > /tmp/leave-approve.json
          grep -q '"status":"APPROVED"' /tmp/leave-approve.json
          curl --fail --silent --show-error -b /tmp/resident.cookies -H 'Content-Type: application/json' \
            -d '{"startDate":"2026-09-05","endDate":"2026-09-05","reason":"CI rejection path","mealType":"ALL","mealIds":[]}' \
            http://127.0.0.1:8787/api/v1/leave > /tmp/leave-create.json
          LEAVE_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/leave-create.json','utf8'));process.stdout.write(x.data.id)")
          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d '{"status":"REJECTED","adminNotes":"CI rejection"}' \
            "http://127.0.0.1:8787/api/v1/leave/$LEAVE_ID" > /tmp/leave-reject.json
          grep -q '"status":"REJECTED"' /tmp/leave-reject.json

      - name: Payment submission and review regression
        run: |
          set -euo pipefail
          printf '%%PDF-1.4\n%% BoardOps CI payment proof\n' > /tmp/payment-proof.pdf

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            http://127.0.0.1:8787/api/v1/funds/ledger > /tmp/ledger-before.json
          grep -q '"balanceMinor":250000' /tmp/ledger-before.json

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            -F amountMinor=12345 -F method=UPI -F reference=CI-PAY-001 -F 'note=CI resident submission' \
            -F 'proof=@/tmp/payment-proof.pdf;type=application/pdf' \
            http://127.0.0.1:8787/api/v1/payments > /tmp/submission.json
          grep -q '"status":"PENDING"' /tmp/submission.json
          grep -q 'payment-proof.pdf' /tmp/submission.json
          SUBMISSION_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/submission.json','utf8'));process.stdout.write(x.data.payment.id)")
          PROOF_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/submission.json','utf8'));process.stdout.write(x.data.payment.proofs[0].id)")
          test -n "$SUBMISSION_ID"
          test -n "$PROOF_ID"

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            http://127.0.0.1:8787/api/v1/funds/ledger > /tmp/ledger-pending.json
          grep -q '"balanceMinor":250000' /tmp/ledger-pending.json

          curl --fail --silent --show-error -b /tmp/admin.cookies \
            http://127.0.0.1:8787/api/v1/payments > /tmp/admin-payments.json
          grep -q "$SUBMISSION_ID" /tmp/admin-payments.json
          grep -q '"status":"PENDING"' /tmp/admin-payments.json

          PROOF_STATUS=$(curl --silent --show-error -o /tmp/downloaded-proof.pdf -w '%{http_code}' -b /tmp/admin.cookies \
            "http://127.0.0.1:8787/api/v1/payments/$SUBMISSION_ID/proofs/$PROOF_ID")
          test "$PROOF_STATUS" = "200"
          grep -q '%PDF-1.4' /tmp/downloaded-proof.pdf

          APPROVE_BODY='{"action":"APPROVE","reason":"Proof verified","idempotencyKey":"ci-approve-payment-0001"}'
          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d "$APPROVE_BODY" "http://127.0.0.1:8787/api/v1/payments/$SUBMISSION_ID/review" > /tmp/approved.json
          grep -q '"status":"APPROVED"' /tmp/approved.json

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            http://127.0.0.1:8787/api/v1/funds/ledger > /tmp/ledger-approved.json
          grep -q '"balanceMinor":262345' /tmp/ledger-approved.json
          grep -q '"entryType":"PAYMENT"' /tmp/ledger-approved.json

          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d "$APPROVE_BODY" "http://127.0.0.1:8787/api/v1/payments/$SUBMISSION_ID/review" > /tmp/approve-retry.json
          grep -q '"idempotent":true' /tmp/approve-retry.json

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            -F amountMinor=5000 -F method=BANK_TRANSFER -F reference=CI-REJECT-001 \
            -F 'proof=@/tmp/payment-proof.pdf;type=application/pdf' \
            http://127.0.0.1:8787/api/v1/payments > /tmp/reject-submission.json
          REJECT_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/reject-submission.json','utf8'));process.stdout.write(x.data.payment.id)")
          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d '{"action":"REJECT","reason":"Proof does not match transaction"}' \
            "http://127.0.0.1:8787/api/v1/payments/$REJECT_ID/review" > /tmp/rejected.json
          grep -q '"status":"REJECTED"' /tmp/rejected.json

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            http://127.0.0.1:8787/api/v1/funds/ledger > /tmp/ledger-after-reject.json
          grep -q '"balanceMinor":262345' /tmp/ledger-after-reject.json

          VOID_BODY='{"action":"VOID","reason":"Approved receipt requires correction","idempotencyKey":"ci-void-payment-0001"}'
          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d "$VOID_BODY" "http://127.0.0.1:8787/api/v1/payments/$SUBMISSION_ID/review" > /tmp/voided.json
          grep -q '"status":"VOID"' /tmp/voided.json
          grep -q '"reversalId"' /tmp/voided.json

          curl --fail --silent --show-error -b /tmp/resident.cookies \
            http://127.0.0.1:8787/api/v1/funds/ledger > /tmp/ledger-void.json
          grep -q '"balanceMinor":250000' /tmp/ledger-void.json
          grep -q 'PAYMENT_REVERSAL' /tmp/ledger-void.json

          curl --fail --silent --show-error -b /tmp/admin.cookies -X PATCH -H 'Content-Type: application/json' \
            -d "$VOID_BODY" "http://127.0.0.1:8787/api/v1/payments/$SUBMISSION_ID/review" > /tmp/void-retry.json
          grep -q '"idempotent":true' /tmp/void-retry.json

      - name: Communications regression
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -b /tmp/admin.cookies -H 'Content-Type: application/json' \
            -d '{"title":"CI operations notice","body":"This verifies announcement fan-out and the durable outbox.","type":"INFO","priority":"HIGH","targetAudience":"ALL","isPinned":true,"status":"PUBLISHED"}' \
            http://127.0.0.1:8787/api/v1/announcements > /tmp/announcement.json
          ANNOUNCEMENT_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/announcement.json','utf8'));process.stdout.write(x.data.id)")
          curl --fail --silent --show-error -b /tmp/resident.cookies http://127.0.0.1:8787/api/v1/announcements > /tmp/resident-announcements.json
          grep -q 'CI operations notice' /tmp/resident-announcements.json
          curl --fail --silent --show-error -b /tmp/admin.cookies 'http://127.0.0.1:8787/api/v1/communications/outbox?status=PENDING' > /tmp/outbox.json
          grep -q 'announcement.published' /tmp/outbox.json
          grep -q 'payment.submitted' /tmp/outbox.json
          grep -q 'payment.approved' /tmp/outbox.json
          grep -q 'payment.rejected' /tmp/outbox.json
          grep -q 'payment.voided' /tmp/outbox.json
          curl --fail --silent --show-error -b /tmp/admin.cookies -X DELETE -H 'Content-Type: application/json' -d '{}' \
            "http://127.0.0.1:8787/api/v1/announcements/$ANNOUNCEMENT_ID" > /tmp/archive-announcement.json
          grep -q '"archived":true' /tmp/archive-announcement.json

      - name: Stop local Worker
        if: always()
        run: |
          if test -f /tmp/boardops-worker.pid; then kill "$(cat /tmp/boardops-worker.pid)" || true; fi
